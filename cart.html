
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 18px;
            margin: 15px auto;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-item-info {
            flex: 1;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .quantity-controls button,
        .remove-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .quantity-controls button {
            background: #eee4fa;
        }

        .remove-btn {
            background: #fce3e9;
            color: #a32d50;
        }

        .cart-total {
            margin-top: 25px;
            color: #49346b;
        }

        @media (max-width: 480px) {
            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">ShopEase<span>.</span></a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="featured-section">
        <h2>Your Shopping Cart 🛒</h2>
        <p>Review your selected products.</p>

        <div id="cart-items"></div>
        <h2 id="cart-total" class="cart-total"></h2>
    </main>

    <footer>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>

    <script>
        function renderCart() {
            const container = document.getElementById("cart-items");
            const totalElement = document.getElementById("cart-total");

            if (cart.length === 0) {
                container.innerHTML =
                    "<p>Your cart is empty. <a href='products.html'>Explore products</a></p>";
                totalElement.textContent = "";
                return;
            }

            let total = 0;
            container.innerHTML = "";

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);

                if (!product) return;

                const itemTotal = product.price * item.quantity;
                total += itemTotal;

                const div = document.createElement("div");
                div.className = "cart-item";

                div.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">

                    <div class="cart-item-info">
                        <h3>${product.name}</h3>
                        <p>₹${product.price.toLocaleString("en-IN")}</p>

                        <div class="quantity-controls">
                            <button data-action="decrease" data-id="${product.id}">−</button>
                            <span>${item.quantity}</span>
                            <button data-action="increase" data-id="${product.id}">+</button>
                        </div>
                    </div>

                    <button class="remove-btn"
                        data-action="remove"
                        data-id="${product.id}">
                        Remove
                    </button>
                `;

                container.appendChild(div);
            });

            totalElement.textContent =
                "Total: ₹" + total.toLocaleString("en-IN");
        }

        document.getElementById("cart-items").addEventListener("click", function(event) {
            const button = event.target.closest("button[data-action]");

            if (!button) return;

            const id = Number(button.dataset.id);
            const action = button.dataset.action;

            if (action === "increase") updateQuantity(id, 1);
            if (action === "decrease") updateQuantity(id, -1);
            if (action === "remove") removeFromCart(id);
        });

        renderCart();
    </script>

    <!-- Router must be loaded after the cart page script -->
    <script src="js/router.js"></script>

</body>
</html>
